name: 🔌 Support for a server or metric
description: Ask for a model server, exporter or metric Tensyr doesn't read yet.
title: "[Server] "
labels: ["server support"]
body:
  - type: input
    id: server
    attributes:
      label: Server or exporter
      placeholder: TensorRT-LLM / Triton 25.01
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Where it publishes metrics
      description: The path and format, if you know it.
      placeholder: http://host:8002/metrics (Prometheus)
    validations:
      required: false
  - type: textarea
    id: sample
    attributes:
      label: A sample of its metrics page
      description: Paste the lines that matter (tokens, requests, latency). Remove host names first.
      render: text
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: What would you like Tensyr to show from it?
    validations:
      required: false
